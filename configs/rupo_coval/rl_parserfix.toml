output_dir = "outputs/rupo-coval-qwen4b-r128-2x2-parserfix"
max_steps = 200
seq_len = 4096

[deployment]
gpus_per_node = 4
num_train_gpus = 2
num_infer_gpus = 2

[model]
name = "Qwen/Qwen3-4B-Instruct-2507"

[wandb]
project = "rupo-coval"
name = "qwen3-4b-r128-2x2-parserfix"
offline = false

[trainer.model.ac]
freq = 1

[trainer.model.lora]
rank = 128
alpha = 256

[trainer.tokenizer]
name = "Qwen/Qwen3-4B-Instruct-2507"

[trainer.optim]
lr = 1e-5
weight_decay = 0.0

[orchestrator]
batch_size = 256
rollouts_per_example = 8

[orchestrator.sampling]
max_tokens = 512

[[orchestrator.env]]
id = "rupo-coval-alignment"
name = "rupo-coval-alignment"
args = { mode = "oracle,pointwise", max_examples = -1, shuffle = true, seed = 42, parse_failure_reward = 0.0 }

[inference]
gpu_memory_utilization = 0.75

[inference.model]
max_model_len = 4096

[inference.vllm_extra]
max_num_seqs = 128
